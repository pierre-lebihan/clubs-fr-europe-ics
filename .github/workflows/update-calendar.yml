name: Update European French Clubs ICS

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate filtered ICS calendar
        run: python3 scripts/generate_ics.py

      - name: Commit and push updated calendar if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.ics
          if git diff --cached --quiet; then
            echo "No changes to docs/calendar.ics"
          else
            git commit -m "chore: update European French clubs ICS [skip ci]"
            git push
          fi
